version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres-container
    environment:
      POSTGRES_DB: bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: botcitygadget-bot-container
    environment:
      - DB_URL=${DB_URL}
      - TOKEN=${TOKEN}
      - ADMIN_ID=${ADMIN_ID}
    depends_on:
      - postgres
    ports:
      - "5001:5000"

volumes:
  postgres-data:
